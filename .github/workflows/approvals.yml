name: Approval check
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: approval-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  approval-check:
    name: Approval check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          read -r base head < <(gh api "repos/$REPO/pulls/$PR" --jq '"\(.base.sha) \(.head.sha)"')
          git fetch -q origin "$base" "$head"
          ids() { git log --reverse --format=%H -n "$1" "$2" | while read -r c; do git show -U0 "$c" | git patch-id --verbatim | cut -d' ' -f1; done; }
          n=$(git rev-list --count "$base..$head")
          cur=$(ids "$n" "$head")
          approvals=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate --jq '.[] | select(.state=="APPROVED") | "\(.user.login) \(.commit_id)"')
          [ -n "$approvals" ] || { echo "No approvals yet."; exit 0; }
          while read -r who sha; do
            if git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch -q origin "$sha"; then
              if [ "$(ids "$n" "$sha")" = "$cur" ]; then echo "Approval by $who at ${sha:0:7} covers the current code."; exit 0; fi
            fi
            echo "Approval by $who at ${sha:0:7} is for different code."
          done <<<"$approvals"
          echo "::error::The code changed since every approval. Re-approve to merge."
          exit 1
